<script src="https://cdn.tailwindcss.com"></script>

<style>
:root{--p:#2A3C76;--pc:#DDE3F2;--ov:#5B6485;--c:#FE696E;--g:linear-gradient(135deg,#2A3C76,#4A62A8)}
body{font-family:Sarabun,sans-serif;color:#1E2440;background:#F1F2F6}
.card{color:#1E2440;background:#fff;border:0;border-radius:22px;box-shadow:0 10px 30px rgba(42,60,118,.07)}

.btn:hover{filter:brightness(1.08)}.btn:disabled{opacity:.6}
.btn-c{background:linear-gradient(90deg,#FE696E,#F38A8E);box-shadow:0 10px 22px rgba(254,105,110,.32)}

.sw{position:relative;display:inline-flex;width:46px;height:26px;flex-shrink:0;cursor:pointer}.sw input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1;width:100%;height:100%}.sw span{width:46px;height:26px;border-radius:999px;background:#C9CEDD;padding:3px;box-sizing:border-box;transition:.2s;display:flex}.sw span::after{content:'';width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}.sw input:checked+span{background:linear-gradient(90deg,#2A3C76,#FE696E)}.sw input:checked+span::after{transform:translateX(20px)}.sw input:focus-visible+span{outline:2px solid #FE696E;outline-offset:2px}
.tgl{width:46px;height:26px;border-radius:999px;border:0;padding:3px;background:#C9CEDD;display:flex;flex-shrink:0;cursor:pointer;transition:.2s}.tgl::after{content:'';width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}.tgl[aria-pressed=true]{background:linear-gradient(90deg,#2A3C76,#FE696E)}.tgl[aria-pressed=true]::after{transform:translateX(20px)}.tgl:disabled{opacity:.5;cursor:default}
.fh,h1,h2,h3,.btn,.nav,.tab,summary,th,#h-age,#h-ten,#h-lv{font-family:Prompt,Sarabun,sans-serif}
.lbl{display:block;font-size:.8rem;font-weight:700;color:var(--ov);margin-bottom:.35rem}

.nav i{font-size:1.15rem}.nav:hover .ic{background:var(--pc)}.nav.on{color:var(--p);font-weight:700}.nav.on .ic{background:var(--p);color:#fff;box-shadow:0 8px 18px rgba(42,60,118,.3)}

.rt{border-collapse:collapse;width:100%}.rt th,.rt td{border:1px solid #9AA3BE;padding:5px 7px;font-size:12px;white-space:normal;vertical-align:top;text-align:left}.rt th{background:#EEF1F8;color:#2A3C76;text-align:center;vertical-align:middle;font-family:Prompt,Sarabun,sans-serif}.rt .c{text-align:center}.rt .r{text-align:right}.rf-doc{font-family:Sarabun,sans-serif;color:#1A1C1E}.rf-doc h3{text-align:center;font-weight:700;font-size:16px;margin:0 0 6px}.rf-doc .meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:13px;margin-bottom:8px}
@media print{#app,#login,#md,#jserr{display:none!important}#pa{display:block}.rt th,.rt td{border:1px solid #555;font-size:10.5px;padding:3px 4px}.rt th{background:#eee;color:#000}}
</style></head>
<body>

 <div class="absolute -right-16 -top-16 w-48 h-48 rounded-full bg-[var(--pc)] pointer-events-none"></div><div class="absolute right-10 top-16 w-12 h-12 rounded-full bg-[#FE696E] opacity-80 pointer-events-none"></div>
 <div class="relative flex items-center gap-3"><img src="https://i.postimg.cc/pXHW7T4D/Squre-profile-pink-bg.jpg" class="w-12 h-12 rounded-2xl object-cover" alt="โลโก้"><div><div class="fh font-bold text-[var(--p)]">HR Workspace</div><div class="text-xs text-slate-500">โรงพยาบาลรักษ์สกล</div></div></div>
 <h1 class="relative mt-10 text-[32px] leading-tight font-semibold text-[var(--p)]">เข้าสู่ระบบ</h1><p class="text-sm text-slate-500 mt-1 mb-6">พนักงานใช้รหัส 4 หลัก และรหัสผ่านเดียวกับระบบลา</p>
 <div class="flex bg-[#F1F2F6] rounded-full p-1 mb-7"><button id="t-emp" class="tab on flex-1" onclick="lt('emp')">พนักงาน</button><button id="t-hr" class="tab flex-1" onclick="lt('hr')">ผู้ดูแลระบบ</button></div>
 <div id="p-emp">
  <form id="f-emp" onsubmit="event.preventDefault();eNext(event)" class="space-y-5">
   <div class="fl"><label for="li">รหัสพนักงาน</label><input id="li" required placeholder="เช่น 2101" autocomplete="username" class="inp font-mono uppercase"></div>
   <label class="flex gap-2 text-sm text-slate-600 leading-relaxed"><input type="checkbox" required class="mt-1 w-4 h-4 accent-[#2A3C76]"><span>ยินยอมให้ประมวลผลข้อมูลส่วนบุคคลตาม <a href="#" onclick="event.preventDefault();pdpa()" class="text-[var(--p)] font-semibold underline">นโยบาย PDPA</a></span></label>
   <button class="btn btn-c w-full justify-center !py-3.5 !text-base">ถัดไป <i class="fa-solid fa-arrow-right"></i></button>
  </form>
  <div id="s2" class="hidden space-y-5"><div id="wn" class="p-4 rounded-2xl bg-[var(--pc)] font-semibold text-[var(--p)]"></div>
   <div class="fl"><label for="pw1">รหัสผ่าน</label><input id="pw1" type="password" autocomplete="current-password" placeholder="รหัสผ่าน" class="inp" onkeydown="event.key=='Enter'&&eLogin()"></div>
   <div class="flex gap-3"><button class="btn btn2" onclick="resetLogin()">ยกเลิก</button><button class="btn btn-c flex-1 justify-center" onclick="eLogin()">เข้าสู่ระบบ</button></div></div>
  <div id="s3" class="hidden space-y-5"><p class="text-sm bg-amber-50 text-amber-900 p-3 rounded-2xl">เข้าใช้งานครั้งแรก กรุณาตั้งรหัสผ่านอย่างน้อย 4 ตัวอักษร</p>
   <div class="fl"><label for="pw2">รหัสผ่านใหม่</label><input id="pw2" type="password" autocomplete="new-password" class="inp"></div><div class="fl"><label for="pw3">ยืนยันรหัสผ่าน</label><input id="pw3" type="password" autocomplete="new-password" class="inp"></div>
   <div class="flex gap-3"><button class="btn btn2" onclick="resetLogin()">ยกเลิก</button><button class="btn btn-c flex-1 justify-center" onclick="eSetup()">เริ่มต้นใช้งาน</button></div></div>
 </div>
 <form id="f-hr" class="hidden space-y-5" onsubmit="event.preventDefault();hrLogin(event)">
  <div class="fl"><label for="lu">ชื่อผู้ใช้งาน</label><input id="lu" required autocomplete="username" class="inp"></div>
  <div class="fl"><label for="lp">รหัสผ่าน</label><input id="lp" type="password" required autocomplete="current-password" class="inp"></div>
  <button class="btn btn-c w-full justify-center !py-3.5 !text-base">เข้าสู่ระบบผู้ดูแลระบบ</button>
 </form>
 <p class="text-center text-sm text-slate-500 mt-7">ลืมรหัสผ่าน? <b class="text-[var(--p)]">ติดต่อฝ่ายบุคคล</b></p>
</div></div>

<!-- APP -->
<div id="app" class="hidden fixed inset-0 flex flex-col">
 <header class="w-full max-w-7xl mx-auto px-4 md:px-8 pt-5 flex items-center gap-3">
  <img src="https://i.postimg.cc/pXHW7T4D/Squre-profile-pink-bg.jpg" class="w-11 h-11 rounded-2xl object-cover" alt="โลโก้">
  <div class="flex-1 min-w-0"><div class="text-xs text-slate-500">สวัสดี</div><div id="un" class="fh font-semibold text-lg text-[var(--p)] truncate leading-tight"></div><div id="ur" class="text-[11px] text-slate-500 font-mono"></div></div>
  <div id="ua" class="w-11 h-11 rounded-full border-2 border-[var(--p)] text-[var(--p)] flex items-center justify-center fh font-semibold text-sm shrink-0"></div>
  <button onclick="askLogout()" class="w-11 h-11 rounded-full bg-[#FE696E] text-white shadow-md shrink-0" title="ออกจากระบบ" aria-label="ออกจากระบบ"><i class="fa-solid fa-power-off"></i></button>
 </header>
 <nav id="nav" class="w-full max-w-7xl mx-auto px-4 md:px-8 pt-5 pb-4 flex gap-3 overflow-x-auto"></nav>
 <main id="main" class="flex-1 overflow-y-auto"><div class="sheet max-w-7xl mx-auto px-4 md:px-8 pt-3 pb-12"><div class="grab"></div><h2 id="tt" class="text-lg md:text-xl font-semibold text-[var(--p)] mb-4"></h2>

   <section id="v-dashboard" class="v hidden max-w-7xl mx-auto">
    <div class="flex justify-between items-center mb-5 gap-3"><p class="text-sm text-slate-500">สถิติกำลังคน การอบรม และอัตราการเข้าออก</p>
     <div class="flex gap-2"><select id="dy" class="inp !w-auto !rounded-full !py-2 !text-xs font-bold" onchange="dashY(this.value)"></select><button class="btn" onclick="refresh()"><i class="fa-solid fa-arrows-rotate"></i> รีเฟรช</button></div></div>
    <div id="dc" class="space-y-4"></div>

   <section id="v-directory" class="v hidden max-w-7xl mx-auto">
    <div class="card p-4 mb-4 flex flex-wrap gap-3"><div class="relative flex-1 min-w-[200px]"><i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-[#89A0CF] text-sm"></i><input id="dq" oninput="dirList()" placeholder="ค้นหารหัส หรือ ชื่อ..." class="inp !pl-11"></div><select id="dd" onchange="dirList()" class="inp !w-auto"></select><select id="ds" onchange="dirList()" class="inp !w-auto"></select><button class="btn btn2" onclick="lvCmp()"><i class="fa-solid fa-code-compare"></i> เทียบกับระบบลา</button></div>
    <div id="dn" class="fh font-semibold text-[var(--p)] mb-2 px-1"></div><div id="dtb" class="card divide-y overflow-hidden"></div>
   </section>

    <div id="rbox" class="card overflow-x-auto"><table id="rtb" class="w-full"></table></div><div id="rreg" class="hidden card p-5 overflow-x-auto"></div>
   </section>
   <section id="v-training" class="v hidden max-w-3xl mx-auto"><div id="mtb" class="space-y-3"></div></section>
   <section id="v-courses" class="v hidden max-w-6xl mx-auto"><div id="cw"></div></section>
   <section id="v-enroll" class="v hidden max-w-3xl mx-auto"><div id="ew"></div></section>
   <section id="v-engage" class="v hidden max-w-6xl mx-auto"><div id="egw"></div></section>
   <section id="v-survey" class="v hidden max-w-3xl mx-auto"><div id="syw"></div></section>
   <section id="v-licenses" class="v hidden max-w-6xl mx-auto"><div id="mlc" class="grid md:grid-cols-2 lg:grid-cols-3 gap-4"></div></section>
  </div></main>
</div>

<!-- QR SCANNER -->
<div id="sc" class="hidden fixed inset-0 z-50 bg-slate-900/80 p-4 items-center justify-center"><div class="card !bg-white w-full max-w-md p-5 text-center"><b class="fh text-[var(--p)]"><i class="fa-solid fa-qrcode mr-1"></i> สแกน QR ประจำตัวพนักงาน</b><div id="scmode" class="flex gap-1 rounded-full p-1 mt-3" style="background:var(--p)"></div><div class="relative mt-3 rounded-2xl overflow-hidden bg-black" style="aspect-ratio:1/1"><video id="scv" playsinline muted class="w-full h-full object-cover"></video><div class="absolute inset-10 border-4 border-white/80 rounded-2xl pointer-events-none"></div></div><div id="scm" class="text-sm mt-3 text-slate-600"></div><button class="btn btn2 mt-4 w-full justify-center" onclick="scanStop()">ปิดกล้อง</button></div></div>

<!-- MODAL -->
<div id="md" class="hidden fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm items-center justify-center p-4">
 <div class="card !bg-white max-w-md w-full p-6 text-center fade"><div id="mi"></div><h3 id="mt" class="text-xl font-bold mb-2"></h3><div id="mb" class="text-sm text-slate-600 text-left max-h-60 overflow-y-auto"></div><div id="mf" class="mt-5 flex gap-3"></div></div>
</div>

<script>
const API='https://script.google.com/macros/s/AKfycbyVD3RKoHOvvdQVAHAgdNBzaveLxZWmjvAid8KVOnH-fiX3wha4aVnTaVBDDrAFMUsv_A/exec';
let TOKEN='',PRE=null,TN={},SX=0;
const DEPTS=['HR-IT','บัญชี','สิทธิประโยชน์-การเงิน','OPD','IPD','เภสัชกรรม','ห้องปฏิบัติการทางการแพทย์','X-Ray','OR-LR','แม่บ้าน','ซักฟอก','หน่วยจ่ายกลาง','โภชนาการ','ศูนย์เปล-ยานยนต์','ช่าง','เวชระเบียน','ส่งเสริมสุขภาพ'];
const TH=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const $=id=>document.getElementById(id),$$=s=>document.querySelectorAll(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const J=s=>{try{const v=JSON.parse(s||'[]');return Array.isArray(v)?v:[]}catch(e){return[]}};
const isOut=e=>e.status=='Resigned'||e.status=='ลาออก';
const nm=e=>`${(e.titlePrefix||'').trim()}${e.firstName||''} ${e.lastName||''}`,N=e=>esc(nm(e));
const D=s=>{if(!s)return'';const d=new Date(s);return isNaN(d)?esc(s):`${String(d.getDate()).padStart(2,0)}/${String(d.getMonth()+1).padStart(2,0)}/${d.getFullYear()+543}`};
const age=d=>{if(!d)return'';const b=new Date(d),t=new Date();let a=t.getFullYear()-b.getFullYear();if(t<new Date(t.getFullYear(),b.getMonth(),b.getDate()))a--;return Math.max(a,0)};

 <div class="card p-5 mb-4"><div class="flex flex-wrap items-baseline justify-between gap-2 mb-1"><b class="fh text-[var(--p)]">คะแนนรายมิติ</b><span class="text-[11px] text-slate-500 flex gap-3 flex-wrap"><span><i class="inline-block w-2.5 h-2.5 rounded-full bg-[#FE696E] mr-1"></i>ไม่เห็นด้วย (1–2)</span><span><i class="inline-block w-2.5 h-2.5 rounded-full bg-[#D5DAE6] mr-1"></i>เฉยๆ (3)</span><span><i class="inline-block w-2.5 h-2.5 rounded-full bg-[#2A3C76] mr-1"></i>เห็นด้วย (4–5)</span></span></div><p class="text-xs text-slate-500 mb-2">เรียงจากคะแนนเห็นด้วยมากไปน้อย 70% ขึ้นไปคือจุดแข็ง 50–69% ปานกลาง ต่ำกว่า 50% ควรปรับปรุง กดที่มิติเพื่อดูรายข้อ</p>${outD.map(d=>row(d,1)).join('')}${drv.map(d=>row(d)).join('')}</div>
 <div class="grid lg:grid-cols-2 gap-4"><div class="card p-5"><b class="fh text-[var(--p)] block mb-1">ผลรายกลุ่มงาน</b><p class="text-xs text-slate-500 mb-3">กลุ่มที่ตอบไม่ถึง ${r.survey.minGroup} คนจะไม่แสดงผล เพื่อรักษาความลับ</p><div class="overflow-x-auto"><table class="w-full"><thead><tr><th>กลุ่มงาน</th><th>ตอบ / ทั้งหมด</th><th>ดัชนี</th><th>eNPS</th></tr></thead><tbody>${r.groups.map(g=>`<tr><td>${esc(g.name)}</td><td>${g.n} / ${g.headcount||'-'}${g.headcount?' <span class="text-slate-400">('+Math.round(g.n/g.headcount*100)+'%)</span>':''}</td>${g.hidden?'<td colspan="2" class="text-slate-400 text-xs">'+(g.shield?'ซ่อนเพิ่ม เพื่อไม่ให้คำนวณย้อนหากลุ่มเล็กได้':'ไม่ถึง '+r.survey.minGroup+' คน')+'</td>':`<td><b class="${lvC(g.index)}">${g.index}%</b></td><td>${sg(g.enps)}</td>`}</tr>`).join('')}</tbody></table></div></div>
 <div class="card p-5"><b class="fh text-[var(--p)] block mb-3">ความคิดเห็นจากผู้ตอบ</b>${r.comments.map(c=>`<div class="mb-3"><div class="text-xs font-semibold text-slate-500 mb-1">${esc(c.text)} (${c.list.length})</div><ul class="text-sm space-y-1.5 max-h-52 overflow-y-auto pr-1">${c.list.map(x=>`<li class="bg-white rounded-xl px-3 py-2">${esc(x)}</li>`).join('')||'<li class="text-slate-400 text-xs">ไม่มี</li>'}</ul></div>`).join('')}<p class="text-[11px] text-slate-400">สลับลำดับแบบสุ่ม และไม่ระบุกลุ่มของผู้เขียน</p></div></div>`}

const hx=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mixC=(a,b,t)=>{const x=hx(a),y=hx(b);return 'rgb('+x.map((v,i)=>Math.round(v+(y[i]-v)*t)).join(',')+')'};
function hmCell(v,base,diff){const x=diff?v-base:v-60,t=Math.max(-1,Math.min(1,x/(diff?15:30))),a=Math.abs(t);
 const bg=a<0.08?'#F4F5F9':mixC('#F4F5F9',t<0?'#C2353A':'#2A3C76',a);return{bg,fg:a>0.55?'#fff':'#1F2A44',txt:diff?sgn(Math.round(x*10)/10):v}}
function egHm(r){const h=r.heat,by=SVH.by,diff=SVH.mode=='diff',ds=h.dims.slice().sort((a,b)=>(a.role=='outcome'?0:1)-(b.role=='outcome'?0:1)),rows=h[by]||[];
 const seg=(k,opts)=>`<div class="inline-flex bg-[#F1F2F6] rounded-full p-1 gap-1">${opts.map(o=>`<button class="tab !py-1.5 !px-3 ${SVH[k]==o[0]?'on':''}" style="background:${SVH[k]==o[0]?'#2A3C76':'transparent'}" onclick="egHeat('${k}','${o[0]}')">${o[1]}</button>`).join('')}</div>`;

 const tdv=(g,d)=>{const v=g.vals[d.id],o=h.org.vals[d.id];if(v==null)return'<td>-</td>';const c=hmCell(v,o,diff);return `<td class="!p-0.5"><div class="rounded-md text-center text-xs font-semibold py-2" style="background:${c.bg};color:${c.fg}" title="${esc(g.name)} · ${esc(d.name)}: เห็นด้วย ${v}% (ทั้งองค์กร ${o}%)">${c.txt}</div></td>`};
 const orgRow=`<tr class="bg-[#F8F9FC]"><td class="sticky left-0 bg-[#F8F9FC] z-[1]"><b>ทั้งองค์กร</b></td><td class="text-center">${h.org.n}</td>${ds.map(d=>`<td class="text-center text-xs font-semibold text-[var(--p)]">${h.org.vals[d.id]}%</td>`).join('')}<td class="text-center text-xs">${sgn(h.org.enps)}</td></tr>`;
 const body=rows.map(g=>g.hidden?`<tr><td class="sticky left-0 bg-[#F7F8FB] z-[1]">${esc(g.name)}</td><td class="text-center">${g.n}</td><td colspan="${ds.length+1}" class="text-xs text-slate-400"><i class="fa-solid fa-user-shield mr-1"></i>${g.shield?'ซ่อนเพิ่ม เพื่อไม่ให้คำนวณย้อนหากลุ่มเล็กได้':'ไม่แสดงผลเพื่อรักษาความลับ (ตอบไม่ถึง '+r.survey.minGroup+' คน)'}</td></tr>`:`<tr><td class="sticky left-0 bg-[#F7F8FB] z-[1] whitespace-nowrap">${esc(g.name)}</td><td class="text-center">${g.n}</td>${ds.map(d=>tdv(g,d)).join('')}<td class="text-center text-xs">${sgn(g.enps)}</td></tr>`).join('');
 const lg=diff?['ต่ำกว่าองค์กร 15 จุดขึ้นไป','ใกล้เคียง','สูงกว่าองค์กร 15 จุดขึ้นไป']:['30% หรือต่ำกว่า','60%','90% ขึ้นไป'];
 return `<div class="card p-5"><div class="flex flex-wrap gap-3 items-center justify-between mb-3"><div><b class="fh text-[var(--p)] block">Heatmap % เห็นด้วยรายมิติ</b><p class="text-xs text-slate-500">ใช้คำตอบทั้งหมดของรอบนี้ ไม่ขึ้นกับตัวกรอง ชี้เมาส์ที่ช่องเพื่อดูค่าจริง</p></div><div class="flex flex-wrap gap-2">${seg('by',[['group','กลุ่มงาน'],['tenure','อายุงาน'],['age','ช่วงอายุ']])}${seg('mode',[['diff','เทียบองค์กร'],['raw','% เห็นด้วย']])}</div></div>
 <div class="overflow-x-auto -mx-1"><table class="w-full hm" style="border-collapse:separate;border-spacing:0"><thead><tr><th class="sticky left-0 z-[2] align-bottom" style="text-align:left">${{group:'กลุ่มงาน',tenure:'อายุงาน',age:'ช่วงอายุ'}[by]}</th><th class="align-bottom text-center">ตอบ</th>${th}<th class="align-bottom text-center">eNPS</th></tr></thead><tbody>${orgRow+body}</tbody></table></div>
 <div class="flex items-center gap-2 mt-4 text-[11px] text-slate-500 flex-wrap"><span>${lg[0]}</span><span class="h-2.5 w-40 rounded-full" style="background:linear-gradient(90deg,#C2353A,#F4F5F9 50%,#2A3C76)"></span><span>${lg[2]}</span><span class="ml-2">ช่องกลางสีเทา = ${lg[1]}</span></div>
 <p class="text-xs text-slate-500 mt-3 leading-relaxed">${diff?'ตัวเลขในช่องคือส่วนต่าง (จุด %) จากค่าทั้งองค์กร ช่องสีแดงเข้มคือกลุ่มที่ควรเข้าไปพูดคุยก่อน':'ตัวเลขในช่องคือ % ผู้ตอบที่เห็นด้วย (4–5) เกณฑ์ 70% ขึ้นไปคือจุดแข็ง ต่ำกว่า 50% ควรปรับปรุง'}</p></div>`}

function drvSvg(d){const W=640,H=380,L=54,R=18,T=20,B=46,ps=d.list.map(x=>x.pos),rs=d.list.map(x=>x.r);
 const x0=Math.max(0,Math.floor((Math.min(...ps)-6)/10)*10),x1=Math.min(100,Math.ceil((Math.max(...ps)+6)/10)*10),y0=Math.floor((Math.min(...rs)-0.05)*10)/10,y1=Math.ceil((Math.max(...rs)+0.05)*10)/10;
 const sx=v=>L+(v-x0)/(x1-x0||1)*(W-L-R),sy=v=>T+(y1-v)/(y1-y0||1)*(H-T-B),mx=sx(d.medPos),my=sy(d.medR);
 let g='';for(let v=x0;v<=x1;v+=10)g+=`<line x1="${sx(v)}" x2="${sx(v)}" y1="${T}" y2="${H-B}" stroke="#EEF0F5"/><text x="${sx(v)}" y="${H-B+16}" font-size="11" text-anchor="middle" fill="#64748B">${v}%</text>`;
 for(let v=y0;v<=y1+1e-9;v=Math.round((v+0.1)*10)/10)g+=`<line x1="${L}" x2="${W-R}" y1="${sy(v)}" y2="${sy(v)}" stroke="#EEF0F5"/><text x="${L-8}" y="${sy(v)+4}" font-size="11" text-anchor="end" fill="#64748B">${v.toFixed(1)}</text>`;
 const q=(x,y,t,a,c)=>`<text x="${x}" y="${y}" font-size="12" font-weight="600" text-anchor="${a}" fill="${c}" opacity=".85">${t}</text>`;
 g+=`<rect x="${L}" y="${T}" width="${Math.max(0,mx-L)}" height="${Math.max(0,my-T)}" fill="#FDECEC" opacity=".6"/><line x1="${mx}" x2="${mx}" y1="${T}" y2="${H-B}" stroke="#A7B1C8" stroke-dasharray="4 4"/><line x1="${L}" x2="${W-R}" y1="${my}" y2="${my}" stroke="#A7B1C8" stroke-dasharray="4 4"/>`+q(L+8,T+16,'เร่งแก้ไข','start','#C2353A')+q(W-R-8,T+16,'จุดแข็ง รักษาไว้','end','#2A3C76')+q(L+8,H-B-8,'ติดตาม','start','#64748B')+q(W-R-8,H-B-8,'คงระดับ','end','#64748B');
 g+=`<text x="${(L+W-R)/2}" y="${H-8}" font-size="12" text-anchor="middle" fill="#334155">คะแนน % เห็นด้วย (ขวา = ดี)</text><text transform="translate(14 ${(T+H-B)/2}) rotate(-90)" font-size="12" text-anchor="middle" fill="#334155">ผลต่อความผูกพัน (r)</text>`;
 const pts=d.list.map(x=>({x,cx:sx(x.pos),cy:sy(x.r)})).sort((a,b)=>a.cy-b.cy),boxes=pts.map(p=>[p.cx-9,p.cy-9,p.cx+9,p.cy+9]),hit=b=>b[0]<L||b[2]>W-R||b[1]<T||b[3]>H-B||boxes.some(o=>b[0]<o[2]&&b[2]>o[0]&&b[1]<o[3]&&b[3]>o[1]);
 pts.forEach(p=>{const w=p.x.name.length*6.3+4,c=[[p.cx+12,p.cy+4,'start'],[p.cx-12,p.cy+4,'end'],[p.cx,p.cy-13,'middle'],[p.cx,p.cy+21,'middle'],[p.cx+12,p.cy-9,'start'],[p.cx+12,p.cy+17,'start'],[p.cx-12,p.cy-9,'end'],[p.cx-12,p.cy+17,'end']],bx=o=>{const x0=o[2]=='start'?o[0]:o[2]=='end'?o[0]-w:o[0]-w/2;return [x0,o[1]-11,x0+w,o[1]+3]};
  let k=c.find(o=>!hit(bx(o)))||c[0];p.lx=k[0];p.ly=k[1];p.la=k[2];boxes.push(bx(k))});
 pts.forEach(p=>{const z=ZN[p.x.zone],top=d.top.indexOf(p.x.id);g+=`<g><title>${esc(p.x.name)}: เห็นด้วย ${p.x.pos}% ผลต่อความผูกพัน r = ${p.x.r}</title><circle cx="${p.cx}" cy="${p.cy}" r="14" fill="transparent"/><circle cx="${p.cx}" cy="${p.cy}" r="${top>=0?8:6}" fill="${z[1]}" stroke="#fff" stroke-width="2"/>${top>=0?`<text x="${p.cx}" y="${p.cy+3.5}" font-size="9" font-weight="700" text-anchor="middle" fill="#fff">${top+1}</text>`:''}<text x="${p.lx}" y="${p.ly}" font-size="11.5" text-anchor="${p.la}" fill="#1F2A44" paint-order="stroke" stroke="#F7F8FB" stroke-width="3">${esc(p.x.name)}</text></g>`});
 return `<svg viewBox="0 0 ${W} ${H}" class="w-full h-auto min-w-[560px]" role="img" aria-label="แผนภาพปัจจัยขับเคลื่อน แกนนอนคือคะแนน แกนตั้งคือผลต่อความผูกพัน">${g}</svg>`}
function egDrv(r){const d=r.drivers;

 const by=id=>d.list.find(x=>x.id==id),tops=d.top.map(by);
 const card=(x,i)=>`<div class="rounded-2xl p-5 bg-white" style="border-top:4px solid #D63D43"><div class="flex items-center gap-2 mb-2"><span class="w-7 h-7 rounded-full bg-[#D63D43] text-white text-sm font-bold grid place-items-center">${i+1}</span><b class="fh text-[var(--p)]">${esc(x.name)}</b></div><div class="flex gap-4 text-sm mb-3"><span>เห็นด้วย <b class="${lvC(x.pos)}">${x.pos}%</b></span><span>ผลต่อความผูกพัน <b>${x.r}</b></span></div><div class="text-xs text-slate-500">ข้อที่คะแนนต่ำสุด</div><div class="text-sm mb-3">${esc(x.low.text)} <b class="${lvC(x.low.pos)}">${x.low.pos}%</b></div><div class="text-xs text-slate-500">แนวทางที่ควรพิจารณา</div><div class="text-sm">${esc(svAct(x.id))}</div></div>`;
 const tb=d.list.slice().sort((a,b)=>b.r-a.r).map(x=>`<tr><td>${esc(x.name)}</td><td class="text-center"><b class="${lvC(x.pos)}">${x.pos}%</b></td><td class="text-center">${x.r}</td><td><span class="chip" style="background:${ZN[x.zone][1]}1A;color:${ZN[x.zone][1]}">${ZN[x.zone][0]}</span></td></tr>`).join('');
 return `<div class="card p-5 mb-4"><b class="fh text-[var(--p)] block">ลำดับความสำคัญ 3 อันดับแรก</b><p class="text-xs text-slate-500 mb-4">มิติที่มีผลต่อความผูกพันสูงแต่คะแนนยังต่ำ ปรับปรุงแล้วน่าจะเห็นผลต่อความผูกพันมากที่สุด (วิเคราะห์จากผู้ตอบ ${d.n} คน)</p><div class="grid md:grid-cols-3 gap-4">${tops.map(card).join('')||'<div class="text-sm text-slate-500">ไม่พบมิติที่มีความสัมพันธ์เชิงบวกกับความผูกพัน</div>'}</div></div>
 <div class="grid lg:grid-cols-5 gap-4"><div class="card p-5 lg:col-span-3"><b class="fh text-[var(--p)] block">แผนภาพจัดลำดับความสำคัญ</b><p class="text-xs text-slate-500 mb-2">เส้นประคือค่ากลางของทั้ง 2 แกน มุมซ้ายบนคือมิติที่ควรเร่งแก้ไข ตัวเลขในจุดคือลำดับความสำคัญ</p><div class="overflow-x-auto -mx-2 px-2">${drvSvg(d)}</div></div>
 <div class="card p-5 lg:col-span-2"><b class="fh text-[var(--p)] block mb-2">ทุกมิติ เรียงตามผลต่อความผูกพัน</b><div class="overflow-x-auto"><table class="w-full"><thead><tr><th>มิติ</th><th class="text-center">เห็นด้วย</th><th class="text-center">r</th><th>กลุ่ม</th></tr></thead><tbody>${tb}</tbody></table></div><p class="text-[11px] text-slate-500 mt-3 leading-relaxed">r คือค่าสหสัมพันธ์ระหว่างคะแนนมิตินั้นกับคะแนนความผูกพันของผู้ตอบแต่ละคน ยิ่งใกล้ 1 ยิ่งไปด้วยกันมาก ใช้บอกความสัมพันธ์ ไม่ได้พิสูจน์ว่าเป็นสาเหตุ</p></div></div>`}

function egRisk(r){const k=r.risk;
 if(!k)return '<div class="card p-10 text-center text-slate-500">ชุดคำถามนี้ไม่มีข้อวัดความตั้งใจทำงานต่อ</div>';
 const kpi=(l,v,s,c,ic)=>`<div class="card p-4"><div class="text-xs text-slate-500"><i class="fa-solid ${ic} mr-1"></i>${l}</div><div class="fh text-2xl font-bold" style="color:${c}">${v}</div><div class="text-[11px] text-slate-500 mt-0.5 leading-snug">${s}</div></div>`;

 const gp=k.gaps?`<div class="card p-5 mb-4"><b class="fh text-[var(--p)] block">กลุ่มเสี่ยงมองต่างจากคนอื่นตรงไหน</b><p class="text-xs text-slate-500 mb-4">% เห็นด้วยของผู้ที่เสี่ยงลาออก เทียบกับผู้ตอบคนอื่น เรียงจากต่างกันมากที่สุด${k.riskEnps!=null?' · eNPS ของกลุ่มเสี่ยง '+sgn(k.riskEnps):''}</p><div class="space-y-3">${k.gaps.slice(0,5).map(x=>`<div class="text-sm"><div class="flex justify-between mb-1"><span>${esc(x.name)}</span><b class="text-[#C2353A]">ต่างกัน ${x.gap} จุด</b></div><div class="relative h-5 bg-[#F1F2F6] rounded-full"><span class="absolute top-1/2 h-[2px] bg-[#A7B1C8]" style="left:${Math.min(x.risk,x.other)}%;width:${Math.abs(x.other-x.risk)}%"></span><span class="absolute top-1/2 -translate-y-1/2 -translate-x-1/2 w-3.5 h-3.5 rounded-full bg-[#C2353A] ring-2 ring-white" style="left:${x.risk}%" title="กลุ่มเสี่ยง ${x.risk}%"></span><span class="absolute top-1/2 -translate-y-1/2 -translate-x-1/2 w-3.5 h-3.5 rounded-full bg-[#2A3C76] ring-2 ring-white" style="left:${x.other}%" title="คนอื่น ${x.other}%"></span></div><div class="flex justify-between text-[11px] text-slate-500 mt-0.5"><span>กลุ่มเสี่ยง ${x.risk}%</span><span>คนอื่น ${x.other}%</span></div></div>`).join('')}</div></div>`:`<div class="card p-4 mb-4 text-sm text-slate-500"><i class="fa-solid fa-user-shield mr-1"></i>กลุ่มเสี่ยงมีน้อยกว่า ${r.survey.minGroup} คน จึงไม่แสดงการเปรียบเทียบความเห็น</div>`;
 return `<div class="card p-4 mb-4 text-sm text-slate-600"><i class="fa-solid fa-circle-info text-[#89A0CF] mr-1"></i>ประเมินจากข้อ "${esc(k.q.text)}" เป็นภาพรวมรายกลุ่มเท่านั้น ระบบไม่ระบุตัวบุคคล</div>

function egCmp(r){const c=r.compare,o=r.prevOptions||[];
 const pick=o.length>1||(o.length&&!SVDM)?`<label class="flex items-center gap-2 text-sm"><span class="text-slate-500 whitespace-nowrap">เทียบกับ</span><select class="inp !py-2 !w-auto max-w-full" onchange="egPrev(this.value)">${o.map(x=>`<option value="${esc(x.id)}" ${x.id==r.prevId?'selected':''}>${esc(x.title)} (${x.n} คำตอบ)</option>`).join('')}</select></label>`:'';
 if(!c)return `<div class="card p-10 text-center"><i class="fa-solid fa-code-compare text-4xl text-[#89A0CF] mb-3 block"></i><b class="fh text-[var(--p)]">ยังไม่มีรอบก่อนหน้าให้เปรียบเทียบ</b><p class="text-sm text-slate-500 mt-1">เมื่อมีแบบสำรวจตั้งแต่ 2 รอบขึ้นไป ระบบจะเทียบกับรอบล่าสุดก่อนหน้าให้อัตโนมัติ โดยจับคู่มิติและข้อคำถามด้วยรหัสเดียวกัน</p>${pick?'<div class="mt-4 flex justify-center">'+pick+'</div>':''}${!SVDM?'<p class="text-sm text-slate-500 mt-3">เปิดสวิตช์ "ข้อมูลตัวอย่าง" ด้านบนเพื่อดูหน้าตาการเปรียบเทียบได้</p>':''}</div>`;
 if(c.suppressed)return `<div class="card p-4 mb-4 flex flex-wrap items-center gap-3"><b class="fh text-[var(--p)]">${esc(c.title)}</b>${pick}</div><div class="card p-10 text-center text-slate-500"><i class="fa-solid fa-user-shield text-3xl text-[#89A0CF] mb-3 block"></i>รอบก่อนหน้ามีผู้ตอบในกลุ่มนี้ ${c.n} คน ไม่ถึง ${r.survey.minGroup} คน จึงไม่แสดงผลเปรียบเทียบ</div>`;
 const ch=(d,good)=>d==null?'<span class="text-slate-400">-</span>':Math.abs(d)<3?`<span class="text-slate-500"><i class="fa-solid fa-equals mr-1 text-[10px]"></i>คงที่ ${sgn(d)}</span>`:`<span class="${(good?d>0:d<0)?'text-green-700':'text-[#C2353A]'}"><i class="fa-solid fa-arrow-${d>0?'up':'down'} mr-1 text-[10px]"></i>${sgn(d)}</span>`;
 const k=(l,a,b,suf,good)=>`<div class="card p-4"><div class="text-xs text-slate-500">${l}</div><div class="flex items-baseline gap-2"><span class="fh text-2xl font-bold text-[var(--p)]">${suf?a+suf:sgn(a)}</span><span class="text-sm font-semibold">${ch(a==null||b==null?null:Math.round((a-b)*10)/10,good)}</span></div><div class="text-[11px] text-slate-500">รอบก่อน ${b==null?'-':suf?b+suf:sgn(b)}</div></div>`;
 const ds=c.dims.slice().sort((a,b)=>(a.role=='outcome'?-1:0)-(b.role=='outcome'?-1:0)||(b.diff||0)-(a.diff||0)),all=ds.flatMap(d=>[d.now,d.prev]).filter(v=>v!=null),lo=Math.max(0,Math.floor((Math.min(...all)-5)/10)*10),hi=Math.min(100,Math.ceil((Math.max(...all)+5)/10)*10),px=v=>(v-lo)/(hi-lo||1)*100;
 const db=d=>`<div class="flex items-center gap-3 py-2 border-b border-[#EEF0F5]"><span class="w-[30%] min-w-0 text-sm ${d.role=='outcome'?'fh font-semibold':''}">${esc(d.name)}</span><div class="relative h-6 flex-1 min-w-[120px]">${d.prev==null?'':`<span class="absolute top-1/2 h-[3px] -translate-y-1/2 rounded-full" style="left:${px(Math.min(d.now,d.prev))}%;width:${Math.abs(px(d.now)-px(d.prev))}%;background:${Math.abs(d.diff)<3?'#C9CEDD':d.diff>0?'#86C79A':'#F3A5A8'}"></span><span class="absolute top-1/2 -translate-y-1/2 -translate-x-1/2 w-3 h-3 rounded-full bg-white border-2 border-[#8792AE]" style="left:${px(d.prev)}%" title="รอบก่อน ${d.prev}%"></span>`}<span class="absolute top-1/2 -translate-y-1/2 -translate-x-1/2 w-3.5 h-3.5 rounded-full ring-2 ring-white" style="left:${px(d.now)}%;background:#2A3C76" title="รอบนี้ ${d.now}%"></span></div><span class="w-12 text-right text-sm font-semibold">${d.now}%</span><span class="w-24 text-right text-xs">${ch(d.diff,1)}</span></div>`;
 const it=(t,a,up)=>`<div class="card p-5"><b class="fh text-[var(--p)] block mb-3"><i class="fa-solid fa-arrow-trend-${up?'up text-green-700':'down text-[#C2353A]'} mr-1"></i>${t}</b>${a.length?a.map(x=>`<div class="text-sm py-2 border-b border-[#EEF0F5]"><div>${esc(x.text)}</div><div class="text-xs text-slate-500 mt-0.5">${esc(x.dim)} · ${x.prev}% → <b>${x.now}%</b> <span class="${up?'text-green-700':'text-[#C2353A]'}">(${sgn(x.diff)})</span></div></div>`).join(''):'<div class="text-sm text-slate-500">ไม่มีข้อที่เปลี่ยน 3 จุดขึ้นไป</div>'}</div>`;
 return `<div class="card p-4 mb-4 flex flex-wrap items-center gap-3 justify-between"><div class="text-sm"><b class="fh text-[var(--p)]">${esc(r.survey.title)}</b> <span class="text-slate-500">เทียบกับ</span> <b class="fh text-[var(--p)]">${esc(c.title)}</b></div>${pick}</div>
 <div class="grid grid-cols-2 lg:grid-cols-5 gap-3 mb-4">${k('ผู้ตอบ',c.now.n,c.prev.n,' คน',1)+k('ดัชนีความผูกพัน',c.now.index,c.prev.index,'%',1)+k('eNPS',c.now.enps,c.prev.enps,'',1)+k('ผูกพันสูง',c.now.high,c.prev.high,'%',1)+k('ไม่ผูกพัน',c.now.low,c.prev.low,'%',0)}</div>
 <div class="card p-5 mb-4"><div class="flex flex-wrap justify-between gap-2 mb-2"><b class="fh text-[var(--p)]">% เห็นด้วยรายมิติ รอบก่อน → รอบนี้</b><span class="text-[11px] text-slate-500 flex gap-3"><span><i class="inline-block w-2.5 h-2.5 rounded-full bg-white border-2 border-[#8792AE] mr-1"></i>รอบก่อน</span><span><i class="inline-block w-2.5 h-2.5 rounded-full bg-[#2A3C76] mr-1"></i>รอบนี้</span><span>เปลี่ยนน้อยกว่า 3 จุดถือว่าคงที่</span></span></div><div class="flex items-center gap-3 text-[10px] text-slate-400"><span class="w-[30%]"></span><div class="flex-1 min-w-[120px] flex justify-between"><span>${lo}%</span><span>${hi}%</span></div><span class="w-12"></span><span class="w-24"></span></div>${ds.map(db).join('')}</div>
 <div class="grid lg:grid-cols-2 gap-4">${it('ข้อที่ดีขึ้นมากที่สุด',c.up,1)+it('ข้อที่ลดลงมากที่สุด',c.down,0)}</div>`}

function egPrint(){const r=SVR;if(!r||r.suppressed)return;
 const c=r.compare&&!r.compare.suppressed?r.compare:null,d=r.drivers&&!r.drivers.few?r.drivers:null,k=r.risk,drv=r.dims.filter(x=>x.role!='outcome').slice().sort((a,b)=>b.pos-a.pos);
 const lvl=p=>p>=70?'ดี':p>=50?'ปานกลาง':'ควรปรับปรุง',cd=id=>c?c.dims.find(x=>x.id==id):null,rr=id=>d?d.list.find(x=>x.id==id):null,fl=Object.keys(SVF).filter(x=>SVF[x]).map(x=>({group:'กลุ่มงาน',tenure:'อายุงาน',age:'ช่วงอายุ'}[x]+' '+SVF[x])).join(', ');
 const diffT=(a,b)=>a==null||b==null?'-':sgn(Math.round((a-b)*10)/10);

 hi.push(`ดัชนีความผูกพัน <b>${r.index}%</b> อยู่ในระดับ${lvl(r.index)}${c?` ${r.index-c.prev.index>=0?'เพิ่มขึ้น':'ลดลง'} ${Math.abs(Math.round((r.index-c.prev.index)*10)/10)} จุดจากรอบก่อน`:''} eNPS <b>${sgn(r.enps)}</b>`);
 if(drv.length)hi.push(`จุดแข็ง: ${drv.slice(0,2).map(x=>esc(x.name)+' '+x.pos+'%').join(', ')} · ควรปรับปรุง: ${drv.slice(-2).reverse().map(x=>esc(x.name)+' '+x.pos+'%').join(', ')}`);
 if(d&&d.top.length)hi.push(`ลำดับความสำคัญในการแก้ไข: ${d.top.map((id,i)=>(i+1)+'. '+esc(rr(id).name)).join(' ')}`);
 if(k){const vg=(k.byGroup||[]).filter(x=>!x.hidden).sort((a,b)=>b.risk-a.risk)[0];hi.push(`ผู้ตอบที่เสี่ยงลาออก <b>${k.risk}%</b> (${k.riskN} คน) และเฝ้าระวัง ${k.watch}%${vg&&(k.byGroup||[]).filter(x=>!x.hidden).length>1?' กลุ่มที่สัดส่วนเสี่ยงสูงสุดคือ'+esc(vg.name)+' '+vg.risk+'%':''}`)}
 if(c){const u=c.dims.filter(x=>x.diff!=null&&x.diff>=3).sort((a,b)=>b.diff-a.diff)[0],w=c.dims.filter(x=>x.diff!=null&&x.diff<=-3).sort((a,b)=>a.diff-b.diff)[0];if(u||w)hi.push(`เทียบกับ${esc(c.title)}: ${u?'ดีขึ้นมากที่สุดคือ'+esc(u.name)+' ('+sgn(u.diff)+')':''}${u&&w?' และ':''}${w?'ลดลงมากที่สุดคือ'+esc(w.name)+' ('+sgn(w.diff)+')':''}`)}
 const css='<style>.ex{font-family:Sarabun,sans-serif;color:#111;font-size:12px;line-height:1.45;-webkit-print-color-adjust:exact;print-color-adjust:exact}.ex h2{font-family:Prompt,Sarabun,sans-serif;font-size:14px;color:#2A3C76;margin:14px 0 6px;border-bottom:2px solid #2A3C76;padding-bottom:3px}.ex table{border-collapse:collapse;width:100%}.ex .t td,.ex .t th{border:1px solid #9AA3B8;padding:3px 5px;font-size:11px}.ex .t th{background:#E9EDF5;text-align:center}.ex .c{text-align:center}.ex .k td{border:1px solid #9AA3B8;padding:6px;text-align:center;width:16.6%}.ex .k b{display:block;font-size:18px;color:#2A3C76;font-family:Prompt,Sarabun,sans-serif}.ex .k small{color:#555}.ex ul{margin:0;padding-left:18px}.ex li{margin:2px 0}.ex tr,.ex li,.ex .pr{page-break-inside:avoid}.ex .g{color:#15803D}.ex .r{color:#B91C1C}</style>';
 const cell=(l,v,s)=>`<td>${l}<b>${v}</b><small>${s||''}</small></td>`;
 const kp=`<table class="k"><tr>${cell('ผู้ตอบ',r.n+' คน',r.headcount?'อัตราตอบ '+Math.round(r.n/r.headcount*100)+'%':'')+cell('ดัชนีความผูกพัน',r.index+'%',c?'รอบก่อน '+c.prev.index+'%':lvl(r.index))+cell('eNPS',sgn(r.enps),c?'รอบก่อน '+sgn(c.prev.enps):'แนะนำ '+r.pro+'%')+cell('ผูกพันสูง',r.high+'%',c?'รอบก่อน '+c.prev.high+'%':r.highN+' คน')+cell('ไม่ผูกพัน',r.low+'%',c?'รอบก่อน '+c.prev.low+'%':r.lowN+' คน')+cell('เสี่ยงลาออก',k?k.risk+'%':'-',k?k.riskN+' คน':'')}</tr></table>`;

 const prT=d&&d.top.length?`<h2>3. ลำดับความสำคัญและแนวทางดำเนินการ</h2><table class="t"><thead><tr><th>ลำดับ</th><th style="text-align:left">มิติ</th><th style="text-align:left">ข้อที่คะแนนต่ำสุด</th><th style="text-align:left">แนวทางที่ควรพิจารณา</th><th>ผู้รับผิดชอบ / กำหนดเสร็จ</th></tr></thead><tbody>${d.top.map((id,i)=>{const x=rr(id);return `<tr><td class="c">${i+1}</td><td><b>${esc(x.name)}</b><br>${x.pos}% · r ${x.r}</td><td>${esc(x.low.text)} (${x.low.pos}%)</td><td>${esc(svAct(x.id))}</td><td style="width:18%"></td></tr>`}).join('')}</tbody></table>`:'';

function svMakeForm(re){const go2=async()=>{busy('กำลังสร้าง Google Form...','<p class="text-center">ใช้เวลาประมาณ 10–20 วินาที</p>');try{const r=await srv('apiSurveyCreateForm',{token:TOKEN,id:SVE.id});await egReload(SVE.id);SVO.form=1;svEdit();modal('สร้าง Google Form แล้ว',`<p class="text-center mb-2">ส่งลิงก์นี้ให้พนักงานตอบแบบนิรนาม</p><input readonly value="${esc(r.formUrl)}" class="inp font-mono !text-xs" onclick="this.select()"><p class="text-xs text-slate-500 mt-2">ฟอร์มอยู่ใน Google Drive ของบัญชีที่ Deploy ระบบ แก้หน้าตาเพิ่มได้ที่ <a href="${esc(r.editUrl)}" target="_blank" rel="noopener" class="underline">หน้าแก้ไขฟอร์ม</a></p>`,'success')}catch(e){modal('สร้างฟอร์มไม่สำเร็จ',esc(e.message),'error')}};
 re?confirmM('สร้างฟอร์มใหม่','<p class="text-center">ฟอร์มเดิมจะไม่ถูกนำคำตอบเข้าอีก กรุณานำคำตอบจากฟอร์มเดิมเข้าระบบก่อน</p>','สร้างฟอร์มใหม่',go2):go2()}
async function svImport(){busy('กำลังนำคำตอบจาก Google Form เข้าระบบ...');try{const r=await srv('apiSurveyImportForm',{token:TOKEN,id:SVE.id});await egReload(SVE.id);modal('นำคำตอบเข้าระบบแล้ว',`<p class="text-center">เพิ่มคำตอบใหม่ <b>${r.added}</b> คำตอบ<br><span class="text-xs text-slate-500">คำตอบที่เคยนำเข้าแล้วจะไม่ถูกนับซ้ำ</span></p>`,'success')}catch(e){modal('นำเข้าไม่สำเร็จ',esc(e.message),'error')}}
async function svCopyForm(){const u=SVE.formUrl;try{await navigator.clipboard.writeText(u);toast('คัดลอกลิงก์ฟอร์มแล้ว','ok')}catch(e){modal('ลิงก์ Google Form',`<input readonly value="${esc(u)}" class="inp font-mono !text-xs" onclick="this.select()">`)}}

async function sy(){$('syw').innerHTML=LOAD2;try{SYL=(await srv('apiSurveyMine',TOKEN)).surveys}catch(e){$('syw').innerHTML=errCard(e);return}syList()}
const syTot=()=>SYS.model.dims.reduce((a,d)=>a+d.items.length,0)+1;
function syList(){SYS=null;$('syw').innerHTML=SYL.length?SYL.map(s=>`<div class="card p-6 mb-4"><div class="flex items-center gap-3 mb-3"><span class="w-11 h-11 rounded-2xl bg-white text-[var(--p)] flex items-center justify-center text-xl shrink-0"><i class="fa-solid fa-clipboard-question"></i></span><div class="flex-1"><b class="fh text-[var(--p)]">${esc(s.title)}</b>${s.closeDate?'<div class="text-xs text-slate-500">ตอบได้ถึง '+D(s.closeDate)+'</div>':''}</div></div>${s.submitted?'<p class="text-sm text-green-700 font-semibold"><i class="fa-solid fa-circle-check mr-1"></i>คุณตอบแบบสำรวจนี้แล้ว ขอบคุณสำหรับความคิดเห็น</p>':`<p class="text-sm text-slate-600">${s.model.dims.reduce((a,d)=>a+d.items.length,0)+1} ข้อ ใช้เวลาประมาณ 6–8 นาที คำตอบเป็นความลับ</p><button class="btn btn-c mt-4" data-i="${esc(s.id)}" onclick="syStart(this.dataset.i)"><i class="fa-solid fa-play"></i> เริ่มทำแบบสำรวจ</button>`}</div>`).join(''):'<div class="card p-10 text-center text-slate-500"><i class="fa-solid fa-clipboard-check text-4xl text-[#89A0CF] mb-3 block"></i>ตอนนี้ยังไม่มีแบบสำรวจที่เปิดให้ตอบ</div>'}
function syStart(id){SYS=SYL.find(s=>s.id==id);SYA={};const m=SYS.model,L=m.scale.labels;
 const opt=(name,v,lab,sm)=>`<label class="lk ${sm?'sm':''}" title="${esc(lab)}"><input type="radio" name="${name}" value="${v}" aria-label="${v} ${esc(lab)}" onchange="syPick('${name}',${v})"><span>${v}</span></label>`;
 $('syw').innerHTML=`<div class="sticky top-0 z-10 bg-white pt-1 pb-3"><div class="flex justify-between text-xs text-slate-500 mb-1"><span class="truncate">${esc(SYS.title)}</span><span id="syp" class="shrink-0 ml-2">0 / ${syTot()} ข้อ</span></div><div class="h-2 rounded-full bg-[#E3E6EF] overflow-hidden"><div id="sypb" class="h-2 rounded-full transition-all" style="width:0;background:linear-gradient(90deg,#2A3C76,#FE696E)"></div></div></div>
 <div class="card p-5 mb-4" style="background:#DDE3F2"><b class="fh text-[var(--p)]"><i class="fa-solid fa-user-shield mr-1"></i> คำตอบของคุณเป็นความลับ</b><p class="text-sm text-slate-600 mt-1 leading-relaxed">ระบบไม่บันทึกรหัสพนักงานคู่กับคำตอบ เก็บเพียงกลุ่มงาน ช่วงอายุงาน และช่วงอายุ และแสดงผลเฉพาะกลุ่มที่มีผู้ตอบตั้งแต่ 5 คนขึ้นไป โปรดตอบตามความรู้สึกจริง</p><p class="text-xs text-slate-600 mt-2">${L.map((l,i)=>(i+1)+' = '+esc(l)).join('&nbsp;&nbsp; ')}</p></div>
 ${m.dims.map((d,k)=>`<div class="card p-5 mb-4"><b class="fh text-[var(--p)] block mb-1">${k+1}. ${esc(d.name)}</b>${d.items.map(it=>`<fieldset class="py-3 border-t border-[#E6E9F1] first-of-type:border-0" id="fs-${esc(it.id)}"><legend class="text-sm mb-2 pt-3">${esc(it.text)}</legend><div class="flex gap-2 flex-wrap items-center"><span class="text-[11px] text-slate-400 w-14 hidden sm:block">ไม่เห็นด้วย</span>${L.map((l,i)=>opt(it.id,i+1,l)).join('')}<span class="text-[11px] text-slate-400 hidden sm:block">เห็นด้วย</span></div></fieldset>`).join('')}</div>`).join('')}
 <div class="card p-5 mb-4"><fieldset id="fs-enps"><legend class="text-sm font-semibold mb-1 text-[var(--p)]">${esc(m.enps.text)}</legend><div class="flex justify-between text-[11px] text-slate-500 mb-2"><span>0 = ไม่แนะนำเลย</span><span>10 = แนะนำอย่างยิ่ง</span></div><div class="flex gap-1.5 flex-wrap">${Array.from({length:11},(x,i)=>opt('enps',i,String(i),1)).join('')}</div></fieldset></div>
 ${(m.open||[]).map(o=>`<div class="card p-5 mb-4"><label class="text-sm font-semibold text-[var(--p)] block mb-2" for="op-${esc(o.id)}">${esc(o.text)} <span class="font-normal text-slate-400">(ไม่บังคับ)</span></label><textarea id="op-${esc(o.id)}" rows="3" maxlength="1000" class="inp"></textarea></div>`).join('')}
 <div class="flex gap-3 justify-end flex-wrap"><button class="btn btn2" onclick="syList()">ยกเลิก</button><button class="btn btn-c" onclick="sySubmit()"><i class="fa-solid fa-paper-plane"></i> ส่งแบบสำรวจ</button></div>`;$('main').scrollTo(0,0)}
function syPick(n,v){SYA[n]=v;const f=$('fs-'+n);if(f)f.classList.remove('miss');const c=Object.keys(SYA).length,t=syTot();$('syp').textContent=c+' / '+t+' ข้อ';$('sypb').style.width=(c/t*100)+'%'}
function sySubmit(){const m=SYS.model,need=[];m.dims.forEach(d=>d.items.forEach(i=>{if(!SYA[i.id])need.push(i.id)}));if(SYA.enps===undefined)need.push('enps');
 if(need.length){need.forEach(n=>{const f=$('fs-'+n);if(f)f.classList.add('miss')});const f=$('fs-'+need[0]);if(f)f.scrollIntoView({behavior:'smooth',block:'center'});return toast('ยังตอบไม่ครบ '+need.length+' ข้อ (ข้อที่ขาดมีกรอบสีแดง)','err')}
 const cm={};(m.open||[]).forEach(o=>{const v=$('op-'+o.id).value.trim();if(v)cm[o.id]=v});const ans=Object.assign({},SYA);delete ans.enps;
 confirmM('ส่งแบบสำรวจ','<p class="text-center">ส่งแล้วจะแก้ไขคำตอบไม่ได้</p>','ส่งแบบสำรวจ',async()=>{busy('กำลังส่งแบบสำรวจ...');try{await srv('apiSurveySubmit',{token:TOKEN,surveyId:SYS.id,answers:ans,enps:SYA.enps,comments:cm});SYS.submitted=true;delete SYS.model;hideM();
  $('syw').innerHTML='<div class="card p-10 text-center"><i class="fa-solid fa-heart text-5xl text-[#FE696E] mb-4 block"></i><b class="fh text-xl text-[var(--p)]">ขอบคุณที่สละเวลาตอบแบบสำรวจ</b><p class="text-sm text-slate-500 mt-2">ความคิดเห็นของคุณจะช่วยให้โรงพยาบาลปรับปรุงได้ตรงจุด</p><button class="btn btn2 mt-5" onclick="syList()">กลับ</button></div>';$('main').scrollTo(0,0)}catch(e){modal('ส่งไม่สำเร็จ',esc(e.message),'error')}})}

function myTr(){const t=tr(my());$('mtb').innerHTML=t.length?t.map(x=>`<div class="card p-4 flex items-center gap-3"><div class="w-11 h-11 rounded-full bg-[var(--pc)] text-[var(--p)] flex items-center justify-center shrink-0"><i class="fa-solid fa-chalkboard-user"></i></div><div class="flex-1 min-w-0"><div class="fh font-semibold">${esc(x.course||'-')}</div><div class="text-xs text-slate-500">${D(x.date)}${x.type?(x.type=='external'?' อบรมภายนอก':' อบรมภายใน'):''}${x.hours?' '+esc(x.hours)+' ชม.':''}${x.checkIn?' เข้า '+hm(x.checkIn)+(x.checkOut?' ออก '+hm(x.checkOut):'')+' น.':''}</div></div>${x.certUrl?`<a href="${esc(x.certUrl)}" target="_blank" class="chip bg-[#FFE3E4] text-[#D63D43]"><i class="fa-solid fa-file-pdf"></i> วุฒิบัตร</a>`:'<span class="text-slate-300">-</span>'}</div>`).join(''):'<div class="card p-10 text-center text-slate-500">ไม่พบประวัติการฝึกอบรม</div>'}
function myLic(){const l=lics(my());$('mlc').innerHTML=l.length?l.map(x=>{const d=x.exp?Math.ceil((new Date(x.exp)-Date.now())/864e5):null,
 b=d==null?'<span class="chip bg-slate-100">ไม่มีวันหมดอายุ</span>':d<0?`<span class="chip bg-[#FFE3E4] text-[#D63D43]">หมดอายุแล้ว ${-d} วัน</span>`:d<=60?`<span class="chip bg-amber-100 text-amber-800">หมดอายุใน ${d} วัน</span>`:`<span class="chip bg-green-100 text-green-800">เหลือ ${d} วัน</span>`;
 return`<div class="card p-5"><div class="flex justify-between mb-3"><i class="fa-solid fa-id-card-clip text-2xl text-[var(--p)]"></i>${b}</div><b class="fh">${esc(x.name||'ไม่ระบุชื่อ')}</b><div class="text-xs font-mono text-slate-500 mb-3">เลขที่: ${esc(x.no||'-')}</div><div class="flex justify-between text-xs border-t pt-3"><span>ออก: ${D(x.issue)||'-'}</span><span>หมดอายุ: ${D(x.exp)||'-'}</span></div></div>`}).join(''):'<div class="card p-10 text-center text-slate-500 col-span-full">ไม่พบข้อมูลใบอนุญาตวิชาชีพ</div>'}
</script>
</body></html>
